# Bot configuration. Secrets (RPC URL with key, API keys, wallet key) go in .env, never here.
# Every value below is the built-in default; a test keeps this file and the schema in sync.
# Fractions are 0..1 (0.05 = 5%). bps = basis points (100 bps = 1%).

# "paper" simulates fills against real Jupiter quotes. "live" sends real transactions
# and requires WALLET_PRIVATE_KEY in .env. Use a separate storage.path per mode.
mode: paper

paper:
  startingSol: 10

chain:
  solMint: So11111111111111111111111111111111111111112
  usdcMint: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v

universe:
  minMarketCapUsd: 150000
  maxMarketCapUsd: 600000
  targetMarketCapUsd: 300000 # candidates closest to this are evaluated first

strategy:
  positionSizeFraction: 0.05 # of current equity, positions valued at sellable (quote) value
  maxOpenPositions: 10
  maxDeployedFraction: 0.5 # deployed capital never exceeds this share of equity
  targetNetMultiplier: 2.5 # net +150% after all costs
  timeStopHours: 48
  stopLoss:
    enabled: false # when false it is still evaluated and logged ("shadow" stop-loss)
    lossFraction: 0.5 # sellable value 50% below cost basis
  unquotableAfterFailures: 3 # consecutive failed sell quotes before flagging "unquotable"

costs:
  swapFeeBps: 0 # platform/referral fee on top of the route
  priorityFeeLamports: 100000 # priority + base fee per swap tx
  expectedSlippageBps: 100 # per side, beyond quoted price impact
  ataRentLamports: 2039280 # token account rent on buy, refunded on full exit

execution:
  buySlippageBps: 300
  sell:
    initialSlippageBps: 300
    slippageStepBps: 300 # added after each failed/partial attempt
    maxSlippageBps: 2000 # cap
    maxAttempts: 6
    retryDelayMs: 2000

loop:
  scanIntervalSec: 60
  monitorIntervalSec: 30
  maxCandidatesPerScan: 20

scanner:
  sources: # birdeye is only used when BIRDEYE_API_KEY is set
    dexscreenerProfiles: true
    dexscreenerBoosts: true
    dexscreenerTakeovers: true
    dexscreenerAds: true
    rugcheckNewTokens: true
    rugcheckRecent: true
    rugcheckTrending: true
    birdeye: true
  excludeDexIds: [pumpfun] # pre-migration bonding curve: no LP, no liquidity figure
  recheckCooldownMinutes: 10 # watchlisted mints are re-priced at most this often
  watchExpiryHours: 72
  maxPricedPerScan: 150 # DexScreener prices 30 mints per call
  reevaluateCooldownMinutes: 60 # don't re-run the filter pipeline on the same mint sooner
  poolListener: # real-time pool creations over the RPC WebSocket (Helius free tier works)
    enabled: true
    pumpGraduations: true # pump.fun -> PumpSwap migrations
    raydiumCpmm: true # Raydium CPMM pools, incl. LaunchLab graduations
    maxResolvesPerHour: 400 # one getTransaction per creation
    backfillLimit: 50 # missed signatures fetched per feed after a reconnect
    idleReconnectMinutes: 10
    reconnectMaxDelaySec: 60

pipeline:
  stopOnFirstReject: true # false = run every filter on every candidate (fuller stats, more API use)

# Every filter: enabled (bool) and onMissingData: reject | skip | warn
#   reject - token fails, counted as "insufficient_data" (separate from real failures)
#   skip   - filter ignored for that token, counted as "skipped"
#   warn   - filter passes, counted as "warn"
filters:
  mintAuthority:
    enabled: true
    onMissingData: reject
  freezeAuthority:
    enabled: true
    onMissingData: reject
  lpLocked:
    enabled: true
    onMissingData: reject
    minBurnedOrLockedFraction: 0.95
  liquidity:
    enabled: true
    onMissingData: reject
    minLiquidityUsd: 40000
    minLiquidityToMcap: 0.1
  holderConcentration:
    enabled: true
    onMissingData: reject
    maxTop10Fraction: 0.3 # excluding LP and burn addresses
    maxSingleWalletFraction: 0.05
    excludeAddresses: # pool accounts found via DexScreener/RugCheck are excluded automatically
      - 1nc1nerator11111111111111111111111111111111 # incinerator
      - "11111111111111111111111111111111" # null
      - 5Q544fKrFoe6tsEbD7S8EWxGZXHw4EjVbG6gdT6HmS3 # Raydium AMM v4 authority
      - GpMZbSM2GgvTKHJirzeGfMFoaZ8UR2X7F4v8vHTvxFbL # Raydium CPMM authority
  devWallet:
    enabled: true
    onMissingData: reject
    maxDevHoldingFraction: 0.05
    maxDevSoldFraction: 0.5
    rejectPriorRugs: true
  honeypot:
    enabled: true
    onMissingData: reject
    maxSellPriceImpact: 0.1 # for a sell sized like our position
    maxRoundTripLoss: 0.15 # quoted buy->sell loss incl. fees + impact (catches sell taxes)
  token2022:
    enabled: true
    onMissingData: reject
    allowedExtensions: # RPC jsonParsed names; anything else rejects (transferFeeConfig even at 0%)
      - metadataPointer
      - tokenMetadata
  bundledLaunch:
    enabled: true
    onMissingData: reject
    launchSlots: 2
    maxLaunchBuyFraction: 0.2 # on-chain: supply bought in launch slots by non-pool wallets
    maxInsiderHeldFraction: 0.15 # held now by top holders RugCheck flags as insiders
    maxLinkedNetworkFraction: 0.5 # supply moved through RugCheck's largest linked-wallet network (calibrate)
    maxSignaturePages: 3 # history pages walked to find the launch; busy tokens fall back to RugCheck
    maxLaunchTransactions: 40
  tokenAge:
    enabled: true
    onMissingData: reject
    minAgeMinutes: 30
  holderCount:
    enabled: true
    onMissingData: reject
    minHolders: 200
  rugcheckScore:
    enabled: true
    onMissingData: reject
    maxNormalisedRiskScore: 30 # RugCheck normalised score is a RISK score: 0 safest, 100 riskiest
    rejectOnDangerRisks: true

# Rate limits and daily budgets per provider. Budgets are persisted in SQLite and reset
# at 00:00 UTC. reserveFraction of each budget is kept for exit quotes and sells, so the
# bot can always get out of positions; scanning pauses once only the reserve remains.
# Defaults are conservative guesses for free tiers. Check them against your plans.
apis:
  jupiter:
    baseUrl: https://lite-api.jup.ag/swap/v1
    timeoutMs: 10000
    maxRetries: 3
    rateLimit: { maxPerSecond: 1, maxPerMinute: 50 }
    budget: { unitsPerDay: 50000, reserveFraction: 0.25 }
  dexscreener:
    baseUrl: https://api.dexscreener.com
    timeoutMs: 10000
    maxRetries: 3
    rateLimit: { maxPerSecond: 2, maxPerMinute: 50 }
    budget: { unitsPerDay: 40000, reserveFraction: 0.25 }
  rugcheck: # observed header: x-rate-limit-limit: 15 (window ~1s)
    baseUrl: https://api.rugcheck.xyz/v1
    timeoutMs: 10000
    maxRetries: 3
    rateLimit: { maxPerSecond: 2, maxPerMinute: 30 }
    budget: { unitsPerDay: 5000, reserveFraction: 0.25 }
  rpc: # actual URL comes from SOLANA_RPC_URL in .env; baseUrl is the keyless fallback
    baseUrl: https://api.mainnet-beta.solana.com
    timeoutMs: 10000
    maxRetries: 3
    rateLimit: { maxPerSecond: 8, maxPerMinute: 300 }
    budget: { unitsPerDay: 30000, reserveFraction: 0.25 }
  birdeye: # used only when BIRDEYE_API_KEY is set
    baseUrl: https://public-api.birdeye.so
    timeoutMs: 10000
    maxRetries: 3
    rateLimit: { maxPerSecond: 1, maxPerMinute: 30 }
    budget: { unitsPerDay: 1000, reserveFraction: 0.25 }

storage:
  path: data/bot.db

killSwitchFile: data/KILL # if this file exists, no new entries are opened

logging:
  level: info
  rateHeaderSampleSec: 60 # store each provider's rate-limit headers at most this often (429s always)
